# ============================================================
# InContext — site configuration (Just the Docs)
# ============================================================

title: "InContext"
description: >-
  A resource site on the craft of context for AI: CLAUDE.md, AGENTS.md,
  Cursor rules, prompt scaffolds, and the patterns that make models
  actually work on real problems.
url: ""                       # set after first deploy, e.g. https://YOUR-USER.github.io
baseurl: ""
repository: "buecking/incontext"

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Theme
remote_theme: just-the-docs/just-the-docs

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# ---- Just the Docs options ----

# Color scheme: "light" or "dark" — "light" is the GitBook-ish look
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive  # respects nav_order numeric overrides

# Aux links (top-right of every page)
aux_links:
  "GitHub":
    - "https://github.com/YOUR-USER/incontext"
aux_links_new_tab: true

# Footer
footer_content: 'InContext &middot; <a href="https://github.com/YOUR-USER/incontext">Source on GitHub</a>'

# Last edited timestamps on each page
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# "Edit this page on GitHub" links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/YOUR-USER/incontext"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Back-to-top button
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchors
heading_anchors: true

# Callouts (used like {: .note }, {: .warning })
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  caveat:
    title: Caveat
    color: red

# Plugins (all GH-Pages-safe)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .github
